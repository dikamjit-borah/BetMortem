<style>
:root{
  color-scheme: light;
  --bg:#F3F5F7; --panel:#FFFFFF; --ink:#18212C; --muted:#5F6B78; --line:#DDE2E8; --grid:#EBEEF2;
  --up:#178A55; --down:#C5413A; --accent:#2F5BD3; --accent2:#9AA6B4; --soft-up:#E3F3EA; --soft-down:#FBE7E5; --soft-acc:#E7EDFB;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#11161C; --panel:#192029; --ink:#E7ECF2; --muted:#98A3B0; --line:#2A333E; --grid:#222A34;
    --up:#3FBF83; --down:#EE6A60; --accent:#7C9CF5; --accent2:#5E6A78; --soft-up:#173527; --soft-down:#3A1F1E; --soft-acc:#1E2945;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#11161C; --panel:#192029; --ink:#E7ECF2; --muted:#98A3B0; --line:#2A333E; --grid:#222A34;
  --up:#3FBF83; --down:#EE6A60; --accent:#7C9CF5; --accent2:#5E6A78; --soft-up:#173527; --soft-down:#3A1F1E; --soft-acc:#1E2945;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 64px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px;margin-bottom:18px}
header.top h1{font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;margin:0}
header.top p{margin:4px 0 0;color:var(--muted);font-size:14px}
.charge{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.charge input{width:64px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-variant-numeric:tabular-nums}
nav.tabs{display:flex;flex-wrap:wrap;gap:10px 22px;padding:12px 0 14px;border-bottom:1px solid var(--line);margin-bottom:22px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
.tg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tg span{font-size:12px;color:var(--muted);margin-right:2px}
.tab{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.tab:hover{border-color:var(--accent)}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab:focus-visible,.cmp tr:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.verdict{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:end;margin-bottom:20px}
.verdict h2{font-family:var(--serif);font-weight:400;font-size:clamp(26px,4vw,40px);line-height:1.15;margin:0;font-variant-numeric:tabular-nums}
.verdict h2 .arrow{color:var(--muted);font-size:.7em;padding:0 .2em}
.verdict .sub{color:var(--muted);margin:6px 0 0;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kpi{background:var(--panel);padding:10px 12px}
.kpi b{display:block;font-family:var(--serif);font-weight:400;font-size:21px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:12px;color:var(--muted)}
.up{color:var(--up)} .down{color:var(--down)}

.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:16px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card h3{font-size:15px;font-weight:600;margin:0}
.card .note{font-size:13px;color:var(--muted);margin:2px 0 12px}
.insights{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.insights li{position:relative;padding-left:16px;font-size:14px;line-height:1.5}
.insights li::before{content:"";position:absolute;left:0;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--accent2)}
.insights li.bad::before{background:var(--down)} .insights li.good::before{background:var(--up)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px;margin-bottom:16px}
.chart{position:relative;min-height:200px}
.chart svg{display:block;width:100%;height:auto}
.chart svg text{font-family:var(--sans);font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart svg text.lbl{fill:var(--ink)}
.empty{display:flex;align-items:center;justify-content:center;min-height:200px;color:var(--muted);font-size:13px;text-align:center;padding:0 12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin:-4px 0 8px;flex-wrap:wrap}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid var(--accent);vertical-align:middle;margin-right:5px}
.legend i.dash{border-top:2px dashed var(--accent2)}
.legend i.sq{width:10px;height:10px;border:0;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);padding:6px 9px;font-size:12px;display:none;z-index:10;max-width:240px;font-variant-numeric:tabular-nums}
.tip .h{color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:500;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel)}
td{padding:6px 8px;border-bottom:1px solid var(--grid);vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
.cmp tbody tr{cursor:pointer}
.cmp tbody tr:hover{background:var(--soft-acc)}
.cmp tr.sec td{background:var(--bg);color:var(--muted);font-size:12px;cursor:default;font-weight:500}
.tradebox{max-height:460px;overflow:auto;border-top:1px solid var(--line)}
.tradebox th{position:sticky;top:0;z-index:1}
.search{width:100%;font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px;margin-bottom:10px}
.tag{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;white-space:nowrap;margin:1px 2px 1px 0}
.tag.m{background:var(--soft-down);color:var(--down)} .tag.e{background:var(--soft-acc);color:var(--accent)} .tag.s{background:var(--grid);color:var(--muted)}
.notes{font-size:13px;color:var(--muted);margin:0;padding-left:18px}
.notes li{margin:3px 0}
@media (max-width:820px){.verdict,.split{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.hide-n{display:none}}
@media print{
  nav.tabs,.charge,.search{display:none!important}
  body{background:#fff}
  .card{break-inside:avoid}
  .tradebox{max-height:none;overflow:visible}
}
</style>
</head>

const MONTHS = {'2026-08':'Aug','2026-09':'Sep','2026-10':'Oct'};
let CHARGE = 60, current = 'overview';

const fmt = d3.format(',.0f');
const rs = v => (v<0?'−':'')+'₹'+fmt(Math.abs(v));
const srs = v => (v>0?'+':v<0?'−':'')+'₹'+fmt(Math.abs(v));
const pct = v => isFinite(v)? Math.round(v*100)+'%' : '–';
const dfmt = d3.utcFormat('%b %-d'), pd = s => new Date(s+'T00:00:00Z');
const cls = v => v>0?'up':v<0?'down':'';
const after = r => r.net - (r.cl?0:CHARGE);
const sum = (a,f=x=>x) => a.reduce((s,x)=>s+f(x),0);
const hourLbl = h => (h>12?h-12:h)+(h>=12?' pm':' am');
const sorted = rows => rows.slice().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.t||'')<(b.t||'')?-1:(a.t||'')>(b.t||'')?1:a.id-b.id);

function stats(rows){
  const w=rows.filter(r=>r.net>0), l=rows.filter(r=>r.net<0);
  const s={n:rows.length, wins:w.length, losses:l.length, net:sum(rows,r=>r.net), after:sum(rows,after),
    charges:sum(rows,r=>r.cl?0:CHARGE), est:rows.filter(r=>!r.cl).length};
  s.wr=w.length/rows.length; s.aw=w.length?sum(w,r=>r.net)/w.length:0; s.al=l.length?sum(l,r=>r.net)/l.length:0;
  s.payoff=s.al?s.aw/Math.abs(s.al):0; s.be=(s.aw||s.al)?Math.abs(s.al)/(s.aw+Math.abs(s.al)):0;
  const g=(arr,k)=>{const m=new Map();for(const r of arr){const key=k(r);const o=m.get(key)||{key,n:0,w:0,net:0};o.n++;if(r.net>0)o.w++;o.net+=r.net;m.set(key,o)}return [...m.values()]};
  s.missed=rows.filter(r=>r.pp==='Missed PP'); s.early=rows.filter(r=>r.pp==='Early PP');
  s.tpsl=rows.filter(r=>r.tps); s.slip=rows.filter(r=>r.slip&&r.net<0);
  s.tpp=rows.filter(r=>r.tpp); s.ppx=rows.filter(r=>r.ppx);
  s.tpslPct=l.length?s.tpsl.length/l.length:NaN; s.tppPct=s.ppx.length?s.tpp.length/s.ppx.length:NaN;
  s.days=g(sorted(rows),r=>r.d); s.perDay=rows.length/s.days.length;
  s.causes=g(l,r=>r.cause).sort((a,b)=>a.net-b.net);
  s.pp=['Missed PP','Early PP'].map(k=>{const a=rows.filter(r=>r.pp===k);return {key:k,n:a.length,net:sum(a,r=>r.net)}}).filter(x=>x.n);
  s.nth=['1st','2nd','3rd','4th+'].map((k,i)=>{const a=rows.filter(r=>Math.min(r.n,4)===i+1);return {key:k,n:a.length,w:a.filter(r=>r.net>0).length,net:sum(a,r=>r.net)}}).filter(x=>x.n);
  s.hours=g(rows.filter(r=>r.t),r=>+r.t.slice(0,2)).sort((a,b)=>a.key-b.key);
  s.sides=g(rows,r=>r.side).sort((a,b)=>a.key<b.key?-1:1);
  s.idx=g(rows,r=>r.idx);
  s.months=g(rows,r=>r.m).sort((a,b)=>a.key<b.key?-1:1);
  s.brokers=g(rows,r=>r.b).sort((a,b)=>a.key<b.key?-1:1);
  let c=0,peak=0,dd=0; for(const r of sorted(rows)){c+=r.net;peak=Math.max(peak,c);dd=Math.min(dd,c-peak)} s.maxdd=dd;
  const lp=l.filter(r=>r.idx==='NIFTY').map(r=>Math.abs(r.pts)).sort((a,b)=>a-b); s.medSL=lp.length?d3.median(lp):null;
  return s;
}

function insights(rows, s, v){
  const out=[]; const add=(tone,text)=>out.push({tone,text});
  if(v.id==='overview'){
    const m=s.months.map(x=>{const a=rows.filter(r=>r.m===x.key);const st=stats(a);return {k:MONTHS[x.key],net:x.net,n:x.n,al:st.al}});
    add(m[m.length-1].net>m[0].net?'good':'neutral',`Month by month before charges: ${m.map(x=>x.k+' '+srs(x.net)).join(', ')}. Your average loss shrank from ${rs(m[0].al)} to ${rs(m[m.length-1].al)}, so SL discipline is improving.`);
    add('bad',`But trade count rose from ${m[0].n} in ${m[0].k} to ${m[m.length-1].n} in ${m[m.length-1].k}, and PP mistakes rose with it. More trades have not meant more profit.`);
  }
  if(s.net>0 && s.after<0) add('bad',`Gross ${srs(s.net)}, but about ${rs(s.charges)} in charges (₹${CHARGE} × ${s.est} trades) turns it into ${srs(s.after)}. At ${s.perDay.toFixed(1)} trades a day, charges are your single biggest cost.`);
  else if(s.net<=0) add('bad',`Lost ${rs(Math.abs(s.net))} before charges and ${rs(Math.abs(s.after))} after estimated charges.`);
  else add('good',`Profitable after charges: ${srs(s.after)} (${srs(s.net)} gross).`);
  if(s.losses&&s.wins) add(s.wr>s.be+.05?'good':'bad',`Avg win ${rs(s.aw)} vs avg loss ${rs(Math.abs(s.al))}, a payoff of ${s.payoff.toFixed(2)}. That needs a ${pct(s.be)} win rate just to break even before charges; you're at ${pct(s.wr)}.`);
  if(s.missed.length) add('bad',`${s.missed.length} trade${s.missed.length>1?'s were':' was'} in profit and then hit SL (missed PP), net ${srs(sum(s.missed,r=>r.net))}. Moving SL to cost once up about 3 points would turn most of these into scratches.`);
  if(s.early.length) add('neutral',`${s.early.length} winner${s.early.length>1?'s were':' was'} cut early (early/bad PP), making only ${srs(sum(s.early,r=>r.net))} total. Your notes often say price kept going after you exited.`);
  if(s.tpsl.length) add('bad',`TP after SL: ${s.tpsl.length} of ${s.losses} SL hits (${pct(s.tpslPct)}) — price went to your target after stopping you out.${s.medSL?` Median NIFTY SL was ${s.medSL.toFixed(2)} pts, inside normal candle noise.`:''}`);
  if(s.tpp.length) add('neutral',`TP after PP: ${s.tpp.length} of ${s.ppx.length} PP exits (${pct(s.tppPct)}) — price went on to target after you booked PP. Trail the rest instead of exiting fully.`);
  const known=s.causes.filter(c=>c.key!=='No note');
  if(known.length) add('bad',`Biggest identified loss leak: ${known[0].key.toLowerCase()}, ${known[0].n} trade${known[0].n>1?'s':''} for ${srs(known[0].net)}.`);
  const nn=s.causes.find(c=>c.key==='No note'); if(nn&&nn.n>=3) add('neutral',`${nn.n} losses (${srs(nn.net)}) have no remarks, so their cause is unknown. Log a reason for every trade.`);
  if(s.nth.length>1){const f=s.nth[0], rest=s.nth.slice(1); const rn=sum(rest,x=>x.net), rnN=sum(rest,x=>x.n);
    add(f.net>rn?'good':'neutral',`1st trade of the day: ${srs(f.net)} (${pct(f.w/f.n)} wins). Trades 2 onwards: ${srs(rn)} over ${rnN} trades.`);}
  const hs=s.hours.filter(h=>h.n>=3); if(hs.length>1){const b=hs.reduce((a,x)=>x.net>a.net?x:a), w=hs.reduce((a,x)=>x.net<a.net?x:a);
    if(b.key!==w.key) add('neutral',`Best entry hour: ${hourLbl(b.key)} (${srs(b.net)}, ${b.n} trades). Worst: ${hourLbl(w.key)} (${srs(w.net)}, ${w.n} trades).`);}
  if(s.sides.length===2){const [ce,pe]=s.sides; add('neutral',`CE: ${srs(ce.net)} over ${ce.n} trades (${pct(ce.w/ce.n)} wins). PE: ${srs(pe.net)} over ${pe.n} trades (${pct(pe.w/pe.n)} wins).`);}
  const sx=s.idx.find(x=>x.key==='SENSEX'); if(sx) add('bad',`SENSEX: ${sx.n} trades for ${srs(sx.net)}, including the ${rs(814)} loss on Sep 16. NIFTY alone made ${srs(sum(rows.filter(r=>r.idx==='NIFTY'),r=>r.net))}.`);
  if(s.brokers.length===2){const [g,sh]=s.brokers; add('neutral',`By broker before charges: Groww ${srs(g.net)} over ${g.n} trades, Sahi ${srs(sh.net)} over ${sh.n}. Groww is weighed down by August, your weakest month.`);}
  const wd=s.days.reduce((a,x)=>x.net<a.net?x:a); add('neutral',`Worst day ${dfmt(pd(wd.key))} (${srs(wd.net)}). Largest drawdown from a peak: ${rs(Math.abs(s.maxdd))}.`);
  return out;
}

/* ---------- DOM helpers ---------- */
function h(tag, attrs, ...kids){const e=document.createElement(tag);if(attrs)for(const[k,v]of Object.entries(attrs)){if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else e.setAttribute(k,v)}for(const k of kids){if(k==null)continue;e.append(k.nodeType?k:document.createTextNode(k))}return e}
const tip=document.getElementById('tip');
function showTip(e,lines){tip.replaceChildren(h('div',{class:'h',text:lines[0]}),...lines.slice(1).map(t=>h('div',{text:t})));tip.style.display='block';
  const pad=12,W=document.documentElement.clientWidth;let x=e.pageX+pad,y=e.pageY+pad;if(x+tip.offsetWidth>W-8)x=e.pageX-tip.offsetWidth-pad;tip.style.left=Math.max(4,x)+'px';tip.style.top=y+'px'}
function hideTip(){tip.style.display='none'}
document.body.appendChild(tip);

/* ---------- charts ---------- */
function svgFor(box,H){box.replaceChildren();const W=Math.max(280,box.clientWidth);const svg=d3.select(box).append('svg').attr('viewBox',`0 0 ${W} ${H}`).attr('width','100%');return {svg,W,H}}
function axisW(svg,y,f){const g=svg.append('g').call(d3.axisLeft(y).ticks(4).tickFormat(f));g.attr('font-size',null).attr('font-family',null);const w=d3.max(g.selectAll('text').nodes(),n=>n.getComputedTextLength())||30;g.remove();return w}
function yAxis(svg,y,l,r,f){svg.append('g').attr('transform',`translate(${l},0)`).call(d3.axisLeft(y).ticks(4).tickFormat(f).tickSize(-(r-l))).call(a=>{a.attr('font-size',null).attr('font-family',null);a.select('.domain').remove();a.selectAll('line').attr('stroke','var(--grid)')})}

function lineChart(box, rows){
  const data=sorted(rows); if(!data.length){box.replaceChildren(h('div',{class:'empty',text:'No trades'}));return}
  let a=0,b=0; const pts=[{i:0,g:0,a:0}]; data.forEach((r,i)=>{a+=r.net;b+=after(r);pts.push({i:i+1,g:a,a:b,r})});
  const {svg,W,H}=svgFor(box,240), m={t:12,r:14,b:24};
  const y=d3.scaleLinear(d3.extent(pts.flatMap(p=>[p.g,p.a,0])),[H-m.b,m.t]).nice(); m.l=axisW(svg,y,rs)+10;
  const x=d3.scaleLinear([0,data.length],[m.l,W-m.r]);
  yAxis(svg,y,m.l,W-m.r,rs);
  // month boundaries
  const months=[...new Set(data.map(r=>r.m))]; if(months.length>1) months.forEach(mo=>{const i=data.findIndex(r=>r.m===mo);const xx=x(i);
    svg.append('line').attr('x1',xx).attr('x2',xx).attr('y1',m.t).attr('y2',H-m.b).attr('stroke','var(--line)').attr('stroke-dasharray','3 3');
    svg.append('text').attr('x',xx+4).attr('y',m.t+10).text(MONTHS[mo])});
  svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--accent2)');
  svg.append('g').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).ticks(Math.min(8,W/80)).tickFormat(d=>d?'#'+d:'').tickSize(0).tickPadding(8)).call(a=>{a.attr('font-size',null).attr('font-family',null);a.select('.domain').remove()});
  const ln=k=>d3.line(p=>x(p.i),p=>y(p[k]));
  svg.append('path').datum(pts).attr('fill','none').attr('stroke','var(--accent2)').attr('stroke-width',1.6).attr('stroke-dasharray','5 4').attr('d',ln('a'));
  svg.append('path').datum(pts).attr('fill','none').attr('stroke','var(--accent)').attr('stroke-width',2).attr('stroke-linejoin','round').attr('stroke-linecap','round').attr('d',ln('g'));
  if(data.length<=70) svg.append('g').selectAll('circle').data(pts.slice(1)).join('circle').attr('cx',p=>x(p.i)).attr('cy',p=>y(p.g)).attr('r',2.6).attr('fill',p=>p.r.net>=0?'var(--up)':'var(--down)');
  const hv=svg.append('circle').attr('r',4.5).attr('fill','none').attr('stroke','var(--ink)').attr('display','none');
  svg.append('rect').attr('x',m.l).attr('y',m.t).attr('width',W-m.l-m.r).attr('height',H-m.t-m.b).attr('fill','transparent')
    .on('pointermove',e=>{const [px]=d3.pointer(e);const i=Math.max(1,Math.min(data.length,Math.round(x.invert(px))));const p=pts[i];
      hv.attr('display',null).attr('cx',x(p.i)).attr('cy',y(p.g));
      showTip(e,[`#${p.i} · ${p.r.b} · ${dfmt(pd(p.r.d))}${p.r.t?', '+p.r.t:''}`,p.r.ins,'Trade '+srs(p.r.net),'Running '+srs(p.g),'After charges '+srs(p.a)])})
    .on('pointerleave',()=>{hv.attr('display','none');hideTip()});
}

function vbar(box, rows, label, tipf, H=210){
  if(!rows.length){box.replaceChildren(h('div',{class:'empty',text:'No data for this view'}));return}
  const {svg,W}=svgFor(box,H), m={t:10,r:6,b:24};
  const y=d3.scaleLinear(d3.extent([0,...rows.map(r=>r.net)]),[H-m.b,m.t]).nice(); m.l=axisW(svg,y,rs)+10;
  const x=d3.scaleBand(rows.map(r=>r.key),[m.l,W-m.r]).padding(.28);
  yAxis(svg,y,m.l,W-m.r,rs);
  const xa=svg.append('g').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x).tickSize(0).tickPadding(8).tickFormat(label)).call(a=>{a.attr('font-size',null).attr('font-family',null);a.select('.domain').remove()});
  const mw=d3.max(xa.selectAll('text').nodes(),n=>n.getComputedTextLength())||0, step=Math.ceil((mw+8)/x.step()); if(step>1) xa.selectAll('text').attr('display',(d,i)=>i%step?'none':null);
  svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--accent2)');
  const bw=Math.min(32,x.bandwidth());
  svg.append('g').selectAll('rect').data(rows).join('rect').attr('x',r=>x(r.key)+(x.bandwidth()-bw)/2).attr('width',bw)
    .attr('y',r=>Math.min(y(r.net),y(0))).attr('height',r=>Math.max(1,Math.abs(y(r.net)-y(0)))).attr('rx',Math.min(4,bw/2))
    .attr('fill',r=>r.net>=0?'var(--up)':'var(--down)')
    .on('pointermove',(e,r)=>showTip(e,tipf(r))).on('pointerleave',hideTip);
}

function hbar(box, rows, tipf){
  if(!rows.length){box.replaceChildren(h('div',{class:'empty',text:'Nothing tagged in this view'}));return}
  const rowH=30, H=Math.max(80,rows.length*rowH+8); const {svg,W}=svgFor(box,H);
  const lab=svg.append('g').selectAll('text').data(rows).join('text').attr('class','lbl').text(r=>r.key);
  const lw=d3.max(lab.nodes(),n=>n.getComputedTextLength())||60;
  const val=r=>srs(r.net)+' ('+r.n+')';
  const t=svg.append('text').text(rows.map(val).reduce((a,b)=>a.length>b.length?a:b)); const vw=t.node().getComputedTextLength(); t.remove();
  const x=d3.scaleLinear([0,d3.max(rows,r=>Math.abs(r.net))||1],[lw+12,Math.max(lw+40,W-vw-10)]);
  const y=d3.scaleBand(rows.map(r=>r.key),[4,H-4]).padding(.28);
  lab.attr('x',0).attr('y',r=>y(r.key)+y.bandwidth()/2).attr('dy','.35em');
  svg.append('g').selectAll('rect').data(rows).join('rect').attr('x',x(0)).attr('y',r=>y(r.key)).attr('height',y.bandwidth())
    .attr('width',r=>Math.max(2,x(Math.abs(r.net))-x(0))).attr('rx',4).attr('fill',r=>r.net>=0?'var(--up)':'var(--down)')
    .on('pointermove',(e,r)=>showTip(e,tipf(r))).on('pointerleave',hideTip);
  svg.append('g').selectAll('text').data(rows).join('text').text(val).attr('x',r=>x(Math.abs(r.net))+6).attr('y',r=>y(r.key)+y.bandwidth()/2).attr('dy','.35em');
}

function groupedMonthBroker(box, rows){
  const months=[...new Set(rows.map(r=>r.m))].sort(), brokers=['Groww','Sahi'];
  const data=months.map(m=>({m,vals:brokers.map(b=>{const a=rows.filter(r=>r.m===m&&r.b===b);return {b,n:a.length,net:sum(a,r=>r.net),after:sum(a,after)}})}));
  const H=220,{svg,W}=svgFor(box,H), m={t:10,r:6,b:24};
  const all=data.flatMap(d=>d.vals.flatMap(v=>[v.net,v.after]));
  const y=d3.scaleLinear(d3.extent([0,...all]),[H-m.b,m.t]).nice(); m.l=axisW(svg,y,rs)+10;
  const x0=d3.scaleBand(months,[m.l,W-m.r]).padding(.25), x1=d3.scaleBand(brokers,[0,x0.bandwidth()]).padding(.15);
  yAxis(svg,y,m.l,W-m.r,rs);
  svg.append('g').attr('transform',`translate(0,${H-m.b})`).call(d3.axisBottom(x0).tickSize(0).tickPadding(8).tickFormat(k=>MONTHS[k])).call(a=>{a.attr('font-size',null).attr('font-family',null);a.select('.domain').remove()});
  svg.append('line').attr('x1',m.l).attr('x2',W-m.r).attr('y1',y(0)).attr('y2',y(0)).attr('stroke','var(--accent2)');
  const col={Groww:'var(--accent)',Sahi:'var(--accent2)'};
  const g=svg.append('g').selectAll('g').data(data).join('g').attr('transform',d=>`translate(${x0(d.m)},0)`);
  g.selectAll('rect').data(d=>d.vals.map(v=>({...v,m:d.m}))).join('rect')
    .attr('x',v=>x1(v.b)+(x1.bandwidth()-Math.min(32,x1.bandwidth()))/2).attr('width',Math.min(32,x1.bandwidth()))
    .attr('y',v=>Math.min(y(v.net),y(0))).attr('height',v=>v.n?Math.max(1,Math.abs(y(v.net)-y(0))):0).attr('rx',4).attr('fill',v=>col[v.b])
    .on('pointermove',(e,v)=>showTip(e,[`${v.b} · ${MONTHS[v.m]}`,v.n?`Gross ${srs(v.net)}`:'No file uploaded',v.n?`After charges ${srs(v.after)}`:'',v.n?`${v.n} trades`:''].filter(Boolean))).on('pointerleave',hideTip);
  g.selectAll('text.na').data(d=>d.vals.filter(v=>!v.n).map(v=>({...v}))).join('text').attr('class','na')
    .attr('x',v=>x1(v.b)+x1.bandwidth()/2).attr('y',y(0)-6).attr('text-anchor','middle').text('no data');
}

function pctBars(box, rows){
  const H=96,{svg,W}=svgFor(box,H);
  const lab=svg.append('g').selectAll('text').data(rows).join('text').attr('class','lbl').text(r=>r.key);
  const lw=d3.max(lab.nodes(),n=>n.getComputedTextLength())||60;
  const val=r=>r.of?`${pct(r.n/r.of)} (${r.n} of ${r.of} ${r.unit})`:'–';
  const t=svg.append('text').text(rows.map(val).reduce((a,b)=>a.length>b.length?a:b)); const vw=t.node().getComputedTextLength(); t.remove();
  const x=d3.scaleLinear([0,1],[lw+12,Math.max(lw+60,W-vw-10)]), y=d3.scaleBand(rows.map(r=>r.key),[4,H-4]).padding(.3);
  lab.attr('x',0).attr('y',r=>y(r.key)+y.bandwidth()/2).attr('dy','.35em');
  svg.append('g').selectAll('rect.bg').data(rows).join('rect').attr('x',x(0)).attr('y',r=>y(r.key)).attr('height',y.bandwidth()).attr('width',x(1)-x(0)).attr('rx',4).attr('fill','var(--grid)');
  svg.append('g').selectAll('rect.v').data(rows).join('rect').attr('x',x(0)).attr('y',r=>y(r.key)).attr('height',y.bandwidth())
    .attr('width',r=>r.of?Math.max(2,x(r.n/r.of)-x(0)):0).attr('rx',4).attr('fill',(r,i)=>i?'var(--accent)':'var(--down)')
    .on('pointermove',(e,r)=>showTip(e,[r.key,val(r)])).on('pointerleave',hideTip);
  svg.append('g').selectAll('text').data(rows).join('text').text(val).attr('x',x(1)+6).attr('y',r=>y(r.key)+y.bandwidth()/2).attr('dy','.35em');
}

/* ---------- views ---------- */
function card(title,note,...kids){return h('section',{class:'card'},h('h3',{text:title}),note?h('p',{class:'note',text:note}):null,...kids)}
function kpi(label,val,c){return h('div',{class:'kpi'},h('b',{class:c||'',text:val}),h('i',{text:label}))}

function comparison(){
  const tbl=h('table',{class:'cmp'});
  const cols=['View','Trades','Win rate','Gross','After charges','Avg win','Avg loss','Missed PP','Early PP','TP after SL','TP after PP'];
  tbl.append(h('thead',null,h('tr',null,...cols.map((c,i)=>h('th',{class:i?'r':''+'',text:c})))));
  const tb=h('tbody');
  for(const grp of ['By month','By broker','Broker × month']){
    tb.append(h('tr',{class:'sec'},h('td',{colspan:cols.length,text:grp})));
    for(const v of VIEWS.filter(v=>v.group===grp)){
      const a=DATA.filter(v.f), s=stats(a);
      const tr=h('tr',{tabindex:'0'},h('td',{text:v.label}),h('td',{class:'r',text:s.n}),h('td',{class:'r',text:pct(s.wr)}),
        h('td',{class:'r '+cls(s.net),text:srs(s.net)}),h('td',{class:'r '+cls(s.after),text:srs(s.after)}),
        h('td',{class:'r',text:rs(s.aw)}),h('td',{class:'r',text:rs(Math.abs(s.al))}),
        h('td',{class:'r',text:s.missed.length}),h('td',{class:'r',text:s.early.length}),h('td',{class:'r',text:`${s.tpsl.length} (${pct(s.tpslPct)})`}),h('td',{class:'r',text:`${s.tpp.length} (${pct(s.tppPct)})`}));
      const go=()=>{location.hash=v.id};tr.addEventListener('click',go);tr.addEventListener('keydown',e=>{if(e.key==='Enter')go()});
      tb.append(tr);
    }
  }
  tbl.append(tb); return h('div',{class:'scroll'},tbl);
}

function tradeTable(rows){
  const wrap=h('div'); const q=h('input',{class:'search',type:'search',placeholder:'Search remarks, cause, date, instrument…','aria-label':'Search trades'});
  const box=h('div',{class:'tradebox'}); const tbl=h('table');
  tbl.append(h('thead',null,h('tr',null,h('th',{text:'Date'}),h('th',{class:'hide-n',text:'Time'}),h('th',{text:'Broker'}),h('th',{class:'hide-n',text:'Instrument'}),h('th',{class:'r',text:'Net'}),h('th',{text:'Tags'}),h('th',{class:'hide-n',text:'Remarks'}))));
  const tb=h('tbody'); tbl.append(tb); box.append(tbl);
  const draw=()=>{const s=q.value.toLowerCase();tb.replaceChildren();
    for(const r of sorted(rows)){const tags=[r.pp,r.tps?'TP after SL':'',r.tpp?'TP after PP':'',r.cause].filter(Boolean);
      if(s&&![r.d,r.ins,r.b,r.rem,...tags].join(' ').toLowerCase().includes(s))continue;
      const tg=h('td');tags.forEach(t=>tg.append(h('span',{class:'tag '+(t==='Missed PP'?'m':t==='Early PP'?'e':'s'),text:t})));
      tb.append(h('tr',null,h('td',{text:dfmt(pd(r.d))}),h('td',{class:'hide-n',text:r.t||''}),h('td',{text:r.b}),h('td',{class:'hide-n',text:r.ins}),
        h('td',{class:'r '+cls(r.net),text:srs(r.net)}),tg,h('td',{class:'hide-n',text:r.rem})));}};
  q.addEventListener('input',draw); draw(); wrap.append(q,box); return wrap;
}

  main.append(h('div',{class:'grid'},card('By entry hour',rows.some(r=>!r.t)?'Trades without a logged time are left out.':'From the time in your remarks.',hour),card('CE vs PE'+(s.idx.length>1?' and index':''),null,side)));
  drawers.push(
    ()=>vbar(daily,s.days,k=>dfmt(pd(k)),r=>[dfmt(pd(r.key)),'Gross '+srs(r.net),r.n+' trade'+(r.n>1?'s':'')]),
    ()=>hbar(causes,s.causes,r=>[r.key,srs(r.net),r.n+' losing trades']),

    ()=>vbar(nth,s.nth,k=>k,r=>[r.key+' trade of the day','Gross '+srs(r.net),r.w+' of '+r.n+' won']),
    ()=>vbar(hour,s.hours,hourLbl,r=>[hourLbl(r.key)+' entries','Gross '+srs(r.net),r.w+' of '+r.n+' won']),
    ()=>vbar(side,[...s.sides,...(s.idx.length>1?s.idx:[])],k=>k,r=>[r.key,'Gross '+srs(r.net),r.w+' of '+r.n+' won'])
  );
  main.append(card('All trades','Tags are read from your remarks.',tradeTable(rows)));
  if(v.id==='overview') main.append(h('div',{style:'height:16px'}),card('About this data',null,h('ul',{class:'notes'},
    h('li',{text:'Files used: Groww Aug and Sep, Sahi Sep and Oct. Sahi Aug and Groww Oct were not provided.'}),
    h('li',{text:'Charges were logged only for the first 8 Groww August trades. Every other trade uses the estimate set at the top.'}),

    h('li',{text:'Groww Sep has a "Sep 18, 11:39" trade with the same strike and prices as the 11:17 one, logged between Sep 15 and 17. It may be a duplicate or a wrong date; it is kept as logged.'}),
    h('li',{text:'The Sahi Sep sheet balance skips around Sep 21–22, so running P&L here is rebuilt from each trade\u2019s net P&L.'}),
    h('li',{text:'Missed PP, early PP, TP after SL, TP after PP and loss cause are tags read from your remarks, not from price data. PP exits are winning trades whose remarks mention PP.'}))));
  drawers.forEach(f=>f());
}

  nav.append(g);
}
function route(){const id=location.hash.slice(1);current=VIEWS.some(v=>v.id===id)?id:'overview';render()}
window.addEventListener('hashchange',()=>{route();window.scrollTo({top:0})});
document.getElementById('charge').addEventListener('input',e=>{const v=+e.target.value;if(isFinite(v)&&v>=0){CHARGE=v;render()}});
let rt;window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>drawers.forEach(f=>f()),150)});
route();
</script>
